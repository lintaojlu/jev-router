[project]
name = "jev-next"
version = "0.1.0"
description = "Read a screenshot and ask Jev what to do next for an existing task."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ocrmac",
  "pillow",
  "typesafe-sdk>=0.7.1,<0.8",
]

[project.scripts]
jev-next = "demo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demo"]
